[package]
name = "tabkeeper"
version = "0.1.0"
edition = "2021"
description = "Keep tabs on interesting things on the internet"
license = "MIT"

[workspace]
members = [".", "tabkeeper-iced"]

# The Dioxus app. `dioxus` is enabled by the `desktop`/`web` features (which
# `dx` selects per platform), so the Iced front end doesn't compile it.
[[bin]]
name = "tabkeeper"
path = "src/main.rs"
required-features = ["dioxus"]

[dependencies]
dioxus = { version = "0.7", features = ["router"], optional = true }
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"
rhai = { version = "1", features = ["serde", "no_custom_syntax"] }
scraper = "0.24"
html5ever = "0.35"
ego-tree = "0.10"
roxmltree = "0.20"
regex = "1"
url = "2"
percent-encoding = "2"
uuid = { version = "1", features = ["v4", "serde", "js"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "serde", "wasmbind"] }
futures = "0.3"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "gzip", "brotli"] }

# Native (desktop) only
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
tokio = { version = "1", features = ["rt", "rt-multi-thread", "time", "macros", "sync"] }
notify-rust = "4"
dirs = "6"

# Web only
[target.'cfg(target_arch = "wasm32")'.dependencies]
rhai = { version = "1", features = ["serde", "no_custom_syntax", "wasm-bindgen"] }
getrandom = { version = "0.3", features = ["wasm_js"] }
gloo-timers = { version = "0.3", features = ["futures"] }
js-sys = "0.3"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = ["Window", "Storage", "Notification", "NotificationOptions", "NotificationPermission"] }

[features]
default = []
web = ["dioxus/web"]
desktop = ["dioxus/desktop"]

[profile.wasm-dev]
inherits = "dev"
opt-level = 1

[profile.server-dev]
inherits = "dev"

[profile.android-dev]
inherits = "dev"
